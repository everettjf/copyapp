name: CopyAppCompass
options:
  bundleIdPrefix: dev.copyapp
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.3"
    CURRENT_PROJECT_VERSION: "4"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Show your current position and heading on the compass."
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    SUPPORTS_MACCATALYST: NO
targets:
  CopyAppCompass:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.copyapp.compass
        INFOPLIST_KEY_CFBundleDisplayName: "Copy Compass"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
