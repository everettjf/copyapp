name: CopyAppFixtureClone
options:
  bundleIdPrefix: dev.copyapp
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    SUPPORTS_MACCATALYST: NO
targets:
  CloneCatalogCore:
    type: framework
    platform: iOS
    sources: [Core]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.copyapp.fixtureclone.core
        GENERATE_INFOPLIST_FILE: YES
  CopyAppFixtureClone:
    type: application
    platform: iOS
    sources: [Sources]
    dependencies:
      - target: CloneCatalogCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.copyapp.fixtureclone
        INFOPLIST_KEY_CFBundleDisplayName: "Copy Fixture"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
