<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Copy APP: jailbroken iOS and macOS</title>
<desc id="desc">An iPhone and a Mac app window share an evidence workflow. The desktop chart is an illustration, not a captured app or a live market feed.</desc>
<defs>
