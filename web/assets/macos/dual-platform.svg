  <linearGradient id="phone" x1="60" y1="220" x2="290" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#303832"/><stop offset="1" stop-color="#121713"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#000" flood-opacity=".65"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#96c5a7" stroke-opacity=".045"/></pattern>
</defs>
