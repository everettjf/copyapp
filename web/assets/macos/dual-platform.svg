<svg xmlns="http://www.w3.org/2000/svg" width="880" height="680" viewBox="0 0 880 680" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Copy APP: standard iOS, enhanced iOS and Mac apps</title>
<desc id="desc">Standard and enhanced iPhone routes join a Mac app workflow. The desktop chart is an illustration, not a captured app or a live market feed.</desc>
<defs>
  <radialGradient id="halo"><stop stop-color="#138352" stop-opacity=".09"/><stop offset="1" stop-color="#138352" stop-opacity="0"/></radialGradient>
  <linearGradient id="screen" x1="210" y1="100" x2="720" y2="480" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#f0f8f3"/></linearGradient>
  <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#138352" stop-opacity=".25"/><stop offset="1" stop-color="#138352" stop-opacity="0"/></linearGradient>
  <linearGradient id="phone" x1="60" y1="220" x2="290" y2="610" gradientUnits="userSpaceOnUse"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#dcece2"/></linearGradient>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#6c8e7c" flood-opacity=".18"/></filter>
  <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" stroke="#87b49a" stroke-opacity=".045"/></pattern>
</defs>
<ellipse cx="465" cy="340" rx="415" ry="320" fill="url(#halo)"/>
<circle cx="463" cy="341" r="278" stroke="#138352" stroke-opacity=".11"/>
<circle cx="463" cy="341" r="235" stroke="#91b9a0" stroke-opacity=".13" stroke-dasharray="4 9"/>
<rect x="50" y="50" width="790" height="565" fill="url(#grid)"/>
