<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
  <title id="title">Hopper native analysis evidence from Calculator</title>
  <desc id="desc">A designed evidence card showing the actual function name, address, selected pseudocode excerpt and limitation from the iOS 17 Calculator Hopper case. This is a visualization of recorded output, not a screenshot of Hopper.</desc>
