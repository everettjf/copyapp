    <g font-family="Menlo, Consolas, monospace" font-size="17">
      <text x="85" y="223" fill="#9ab6c5">// class _TtC10Calculator15CalculatorModel</text>
      <text x="85" y="257" fill="#e8f3f5">-(void)buttonPressed:(long long)arg2</text>
      <text x="85" y="306" fill="#d6e5e8">var_18 = [self retain];</text>
      <text x="85" y="340" fill="#f9c980">sub_10000fb4c(arg2);</text>
      <text x="85" y="374" fill="#d6e5e8">r0 = var_18;</text>
      <text x="85" y="408" fill="#9ab6c5">// release path and guard omitted in this excerpt</text>
