<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Copy APP architecture: Mac and jailbroken iPhone</title>
  <desc id="desc">The coding agent and Copy APP CLI run on a Mac. A selected jailbroken iPhone supplies app files, sandbox metadata, UI observations and bounded runtime traces over USB. The Mac records evidence, analyzes native code, builds an independent app, then compares selected flows on the same phone.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#091725"/><stop offset="1" stop-color="#102f32"/></linearGradient>
    <linearGradient id="mac" x2="1" y2="1"><stop stop-color="#172d42"/><stop offset="1" stop-color="#143849"/></linearGradient>
    <linearGradient id="phone" x2="1" y2="1"><stop stop-color="#163c39"/><stop offset="1" stop-color="#235143"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".25"/></filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0 11 5.5 0 11" fill="none" stroke="#f9bf77" stroke-width="2"/></marker>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#79b5ad" opacity=".18"/></pattern>
  </defs>
  <rect width="1600" height="930" fill="url(#bg)"/>
  <rect width="1600" height="930" fill="url(#dots)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="72" y="63" fill="#74e0c7" font-size="18" font-weight="700" letter-spacing="5">COPY APP / SYSTEM MAP</text>
    <text x="72" y="117" fill="#f7fbfa" font-size="44" font-weight="700">From evidence to a measured rebuild</text>
    <text x="72" y="151" fill="#a8c6c7" font-size="20">One exact device · one exact app build · explicit scope · reproducible results</text>

    <rect x="70" y="197" width="865" height="493" rx="24" fill="url(#mac)" stroke="#4d7e91" stroke-width="2" filter="url(#shadow)"/>
    <text x="103" y="239" fill="#82d8ee" font-size="18" font-weight="700" letter-spacing="3">MAC / CONTROL + ANALYSIS</text>
    <text x="103" y="274" fill="#e4f1f4" font-size="17">The host coordinates collection, interpretation, building and verification.</text>
    <rect x="103" y="305" width="374" height="127" rx="14" fill="#102536" stroke="#6b9eb0"/>
    <text x="124" y="337" fill="#77d7ea" font-size="16" font-weight="700">01 · CODING AGENT</text>
    <text x="124" y="371" fill="#fff" font-size="25" font-weight="700">Codex / Claude Code</text>
    <text x="124" y="401" fill="#bdd2da" font-size="16">Plan · interpret · implement · review</text>
    <rect x="505" y="305" width="397" height="127" rx="14" fill="#102536" stroke="#6b9eb0"/>
    <text x="526" y="337" fill="#77d7ea" font-size="16" font-weight="700">02 · COPY APP CLI</text>
    <text x="526" y="371" fill="#fff" font-size="25" font-weight="700">Device + case orchestration</text>
    <text x="526" y="401" fill="#bdd2da" font-size="16">Pin UDID and Bundle ID · verify sources</text>
    <path d="M477 367h27" stroke="#f9bf77" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="103" y="457" width="374" height="183" rx="14" fill="#102536" stroke="#6b9eb0"/>
    <text x="124" y="489" fill="#77d7ea" font-size="16" font-weight="700">03 · LOCAL EVIDENCE CASE</text>
    <text x="124" y="525" fill="#fff" font-size="24" font-weight="700">Hashes + provenance</text>
    <text x="124" y="557" fill="#bdd2da" font-size="16">Package · sandbox · UI · traces</text>
    <text x="124" y="584" fill="#bdd2da" font-size="16">Reports separate fact / inference / unknown</text>
    <text x="124" y="611" fill="#8ce3cc" font-size="15">Private case files stay on the host</text>
    <rect x="505" y="457" width="397" height="183" rx="14" fill="#102536" stroke="#6b9eb0"/>
    <text x="526" y="489" fill="#77d7ea" font-size="16" font-weight="700">04 · ANALYZE + BUILD</text>
    <text x="526" y="525" fill="#fff" font-size="24" font-weight="700">Mach-O → Xcode</text>
    <text x="526" y="557" fill="#bdd2da" font-size="16">Classes, imports, selected functions</text>
    <text x="526" y="584" fill="#bdd2da" font-size="16">Optional Ghidra / Hopper pseudocode</text>
    <text x="526" y="611" fill="#bdd2da" font-size="16">Independent source and signed IPA</text>
    <path d="M477 548h27" stroke="#f9bf77" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="1114" y="197" width="416" height="493" rx="46" fill="#071b1a" stroke="#84b9aa" stroke-width="4" filter="url(#shadow)"/>
    <rect x="1131" y="217" width="382" height="454" rx="30" fill="url(#phone)"/>
    <rect x="1253" y="224" width="138" height="13" rx="7" fill="#071b1a"/>
    <text x="1160" y="274" fill="#8ce3cc" font-size="18" font-weight="700" letter-spacing="2">JAILBROKEN IPHONE</text>
    <text x="1160" y="311" fill="#fff" font-size="26" font-weight="700">Original installed app</text>
    <text x="1160" y="344" fill="#c9e9df" font-size="16">Same device hosts the rebuilt app</text>
    <line x1="1159" x2="1484" y1="371" y2="371" stroke="#79a998" opacity=".7"/>
    <text x="1160" y="410" fill="#fff" font-size="19" font-weight="700">OpenSSH</text>
    <text x="1160" y="434" fill="#c9e9df" font-size="15">Installed files + bounded sandbox</text>
    <text x="1160" y="482" fill="#fff" font-size="19" font-weight="700">iOS MCP / iCTRL</text>
    <text x="1160" y="506" fill="#c9e9df" font-size="15">UI tree · screenshot · actions</text>
    <text x="1160" y="554" fill="#fff" font-size="19" font-weight="700">Frida</text>
    <text x="1160" y="578" fill="#c9e9df" font-size="15">Bounded runtime observation</text>
    <line x1="1159" x2="1484" y1="600" y2="600" stroke="#79a998" opacity=".7"/>
    <text x="1160" y="634" fill="#8ce3cc" font-size="15">iOS 16 · iOS 17 · iOS 26 tested paths</text>

    <path d="M936 406h171" stroke="#f9bf77" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M1108 506H938" stroke="#f9bf77" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="970" y="438" width="102" height="37" rx="18" fill="#273d3d" stroke="#f9bf77"/>
    <text x="992" y="463" fill="#ffe5c4" font-size="16" font-weight="700">USB</text>
    <text x="953" y="548" fill="#c9d5ce" font-size="15">Observe ↑ / deploy ↓</text>

    <text x="72" y="752" fill="#82d8ee" font-size="17" font-weight="700" letter-spacing="3">TWO DELIVERABLES / ONE EVIDENCE CHAIN</text>
    <rect x="70" y="773" width="1460" height="111" rx="20" fill="#102633" stroke="#4f7780"/>
    <g font-size="18" font-weight="700">
      <text x="103" y="817" fill="#fff">1  Analyze</text><text x="103" y="849" fill="#a9c6c8" font-size="15" font-weight="400">Cited report + feature spec</text>
      <text x="445" y="817" fill="#fff">2  Set scope</text><text x="445" y="849" fill="#a9c6c8" font-size="15" font-weight="400">Known flows and target coverage</text>
      <text x="815" y="817" fill="#fff">3  Rebuild</text><text x="815" y="849" fill="#a9c6c8" font-size="15" font-weight="400">Independent runnable iOS app</text>
      <text x="1175" y="817" fill="#fff">4  Compare</text><text x="1175" y="849" fill="#a9c6c8" font-size="15" font-weight="400">Paired results + stated gaps</text>
    </g>
    <path d="M333 828h68M704 828h68M1053 828h68" stroke="#f9bf77" stroke-width="3" marker-end="url(#arrow)"/>
  </g>
</svg>
