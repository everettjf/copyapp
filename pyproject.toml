[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "copyapp"
version = "0.2.0"
description = "Evidence-backed analysis and selected-behavior rebuilding for jailbroken iOS and macOS apps"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = ["pymobiledevice3>=11.31,<12", "Pillow>=11,<12"]

[project.optional-dependencies]
trace = ["frida>=16.1.4,<18", "frida-tools>=14,<15"]

[project.scripts]
copyapp = "copyapp.cli:main"

[project.urls]
Homepage = "https://github.com/everettjf/copyapp"
Documentation = "https://github.com/everettjf/copyapp#readme"
Source = "https://github.com/everettjf/copyapp"

[tool.setuptools.packages.find]
include = ["copyapp*"]

[tool.setuptools.package-data]
copyapp = ["ghidra_scripts/*.java", "ghidra_scripts/REA-LICENSE.txt"]
"copyapp.macos" = ["collector/*.swift"]
