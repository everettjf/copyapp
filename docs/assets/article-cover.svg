<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 680" role="img" aria-labelledby="t d">
<title id="t">Copy APP: observe, understand, rebuild</title><desc id="d">A glowing iPhone links original app evidence to an independent rebuilt app.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#050505"/><stop offset="1" stop-color="#14231a"/></linearGradient><linearGradient id="green" x2="1"><stop stop-color="#00ff66"/><stop offset="1" stop-color="#b3ffcc"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="20"/></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7d9d83" stroke-opacity=".11"/></pattern></defs>
<rect width="1400" height="680" fill="url(#bg)"/><rect width="1400" height="680" fill="url(#grid)"/><circle cx="1030" cy="330" r="215" fill="#00ff66" opacity=".12" filter="url(#glow)"/><circle cx="1030" cy="330" r="265" fill="none" stroke="#00ff66" stroke-opacity=".2"/><circle cx="1030" cy="330" r="190" fill="none" stroke="#00ff66" stroke-opacity=".18" stroke-dasharray="8 12"/>
<text x="85" y="95" fill="#00ff66" font-family="Menlo,monospace" font-size="23" letter-spacing="5">COPY APP  /  OPEN SOURCE</text><text x="78" y="275" fill="#fff" font-family="Arial,sans-serif" font-weight="700" font-size="92" letter-spacing="-5">观察。理解。</text><text x="78" y="385" fill="url(#green)" font-family="Arial,sans-serif" font-weight="700" font-size="92" letter-spacing="-5">重新构建。</text><text x="85" y="456" fill="#b2b2b2" font-family="Arial,sans-serif" font-size="26">从越狱 iPhone 的真实证据，到可运行的独立 iOS App</text><path d="M85 510h490" stroke="#00ff66" stroke-width="2"/><text x="85" y="557" fill="#00ff66" font-family="Menlo,monospace" font-size="20">ANALYZE  →  REBUILD  →  VERIFY</text>
<g transform="translate(925 100) rotate(8 135 235)"><rect width="270" height="470" rx="43" fill="#030303" stroke="#646464" stroke-width="8"/><rect x="12" y="12" width="246" height="446" rx="33" fill="#101910"/><rect x="82" y="12" width="106" height="25" rx="13" fill="#030303"/><path d="M43 108h184v255H43z" fill="none" stroke="#00ff66" stroke-width="2"/><path d="M43 108h30m-30 0v30m184 225h-30m30 0v-30" fill="none" stroke="#00ff66" stroke-width="6"/><circle cx="135" cy="235" r="68" fill="none" stroke="#00ff66" stroke-opacity=".4" stroke-width="2"/><circle cx="135" cy="235" r="38" fill="none" stroke="#00ff66" stroke-width="5"/><circle cx="135" cy="235" r="7" fill="#00ff66"/><path d="M43 183h184" stroke="#00ff66" stroke-width="2" opacity=".7"/><text x="66" y="397" fill="#00ff66" font-family="Menlo,monospace" font-size="14">DEVICE / VERIFIED</text></g>
<rect x="1110" y="158" width="220" height="66" fill="#111" stroke="#00ff66"/><text x="1127" y="184" fill="#00ff66" font-family="Menlo,monospace" font-size="12">01 / OBSERVE</text><text x="1127" y="208" fill="#fff" font-family="Arial,sans-serif" font-size="17">Evidence captured</text><rect x="750" y="462" width="225" height="66" fill="#111" stroke="#00ff66"/><text x="767" y="488" fill="#00ff66" font-family="Menlo,monospace" font-size="12">02 / REBUILD</text><text x="767" y="512" fill="#fff" font-family="Arial,sans-serif" font-size="17">Behavior verified</text>
</svg>
