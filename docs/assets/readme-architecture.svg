<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" fill="none" role="img" aria-labelledby="title description">
<title id="title">Copy APP architecture: understand, rebuild, verify</title>
<desc id="description">Codex or Claude Code uses Copy APP to collect evidence from a jailbroken iPhone or a ChatComputer virtual Mac, build an independent app and compare selected behavior. macOS support is experimental.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#101b36"/><stop offset=".5" stop-color="#101322"/><stop offset="1" stop-color="#172234"/></linearGradient>
  <radialGradient id="blue"><stop stop-color="#459bff" stop-opacity=".16"/><stop offset="1" stop-color="#459bff" stop-opacity="0"/></radialGradient>
  <radialGradient id="purple"><stop stop-color="#b68aff" stop-opacity=".14"/><stop offset="1" stop-color="#b68aff" stop-opacity="0"/></radialGradient>
  <linearGradient id="agent" x1="44" y1="208" x2="279" y2="473" gradientUnits="userSpaceOnUse"><stop stop-color="#172e4f"/><stop offset="1" stop-color="#142238"/></linearGradient>
  <linearGradient id="cli" x1="331" y1="208" x2="616" y2="473" gradientUnits="userSpaceOnUse"><stop stop-color="#352653"/><stop offset="1" stop-color="#221e39"/></linearGradient>
  <linearGradient id="ios" x1="676" y1="178" x2="1236" y2="328" gradientUnits="userSpaceOnUse"><stop stop-color="#153b34"/><stop offset="1" stop-color="#162c2c"/></linearGradient>
  <linearGradient id="mac" x1="676" y1="350" x2="1236" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#3b2c26"/><stop offset="1" stop-color="#292732"/></linearGradient>
  <linearGradient id="output" x1="44" y1="552" x2="1236" y2="692" gradientUnits="userSpaceOnUse"><stop stop-color="#1d2a40"/><stop offset=".5" stop-color="#26243f"/><stop offset="1" stop-color="#253329"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#050a16" flood-opacity=".32"/></filter>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#81baff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#62dfb5" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#ffb77b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" stroke="#b9a0f9" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1280" height="760" rx="24" fill="url(#background)"/>
<rect x=".5" y=".5" width="1279" height="759" rx="23.5" stroke="#4c6081" stroke-opacity=".35"/>
<ellipse cx="190" cy="180" rx="420" ry="290" fill="url(#blue)"/><ellipse cx="980" cy="550" rx="430" ry="300" fill="url(#purple)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
  <rect x="44" y="40" width="48" height="48" rx="13" fill="#244c49" stroke="#6fe3bc" stroke-opacity=".6"/>
  <text x="68" y="71" text-anchor="middle" fill="#86efca" font-size="19" font-weight="700">C/A</text>
  <text x="108" y="75" fill="#f4f7ff" font-size="38" font-weight="750" letter-spacing="-1">Copy APP</text>
  <rect x="897" y="48" width="339" height="31" rx="15.5" fill="#213047" stroke="#4b5a71"/>
  <circle cx="917" cy="63.5" r="4" fill="#80e9c0"/>
  <text x="934" y="69" fill="#d3e1f3" font-size="14" font-weight="600" letter-spacing=".8">JAILBROKEN iOS + macOS</text>
  <text x="44" y="132" fill="#d5dff1" font-size="25" font-weight="500">Understand the original. Build independently. Compare the result.</text>
