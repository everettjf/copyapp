  <rect x="68" y="604" width="40" height="48" rx="7" fill="#d5eafa"/><path d="M80 619h16m-16 8h16m-16 8h10" stroke="#287aa8" stroke-width="2" stroke-linecap="round"/>
  <text x="124" y="626" fill="#203c35" font-size="21" font-weight="650">Report + specification</text><text x="124" y="652" fill="#526d7e" font-size="14">Cited findings + selected scope</text>
  <rect x="455" y="604" width="48" height="48" rx="12" fill="#e1d3f6"/><path d="m469 617 10-5 10 5v17l-10 6-10-6zm0 0 10 6 10-6m-10 6v17" stroke="#7955b4" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="519" y="626" fill="#203c35" font-size="21" font-weight="650">Independent app</text><text x="519" y="652" fill="#725d87" font-size="14">Source + runnable IPA / .app</text>
  <rect x="855" y="604" width="48" height="48" rx="12" fill="#ccebd9"/><path d="m868 628 8 8 15-19" stroke="#16875c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="919" y="626" fill="#203c35" font-size="21" font-weight="650">Selected-flow checks</text><text x="919" y="652" fill="#527363" font-size="14">Behavior + screenshots + gaps</text>
  <text x="44" y="733" fill="#60766b" font-size="14">Selected behavior. Cited evidence. Clear limits.</text>
  <text x="1236" y="733" text-anchor="end" fill="#60766b" font-size="12">iOS + macOS · SHARED EVIDENCE</text>
