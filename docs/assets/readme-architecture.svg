  <g filter="url(#shadow)"><rect x="44" y="208" width="235" height="265" rx="18" fill="url(#agent)" stroke="#39638c"/></g>
  <rect x="66" y="230" width="42" height="42" rx="12" fill="#264c73"/>
  <path d="M78 241h18v13H85l-7 5z" stroke="#a5d5ff" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="121" y="255" fill="#8dc6ff" font-size="12" font-weight="700" letter-spacing="1.1">CODING AGENT</text>
  <text x="66" y="311" fill="#f4f8ff" font-size="29" font-weight="700">Codex /</text>
  <text x="66" y="347" fill="#f4f8ff" font-size="29" font-weight="700">Claude Code</text>
  <text x="66" y="386" fill="#b2c8e0" font-size="15">Plan · interpret · implement</text>
  <rect x="66" y="414" width="191" height="32" rx="8" fill="#203b59"/>
  <text x="161.5" y="435" text-anchor="middle" fill="#b8daff" font-size="13">Your current session</text>
  <!-- Copy APP -->
  <g filter="url(#shadow)"><rect x="331" y="208" width="285" height="265" rx="18" fill="url(#cli)" stroke="#8266ab"/></g>
  <rect x="354" y="230" width="42" height="42" rx="12" fill="#574078"/>
  <path d="m365 242 7 7-7 7m14 0h6" stroke="#d6bcff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="409" y="255" fill="#d0b6ff" font-size="12" font-weight="700" letter-spacing="1.1">LOCAL TOOLKIT</text>
  <text x="354" y="320" fill="#fff" font-size="35" font-weight="750" letter-spacing="-.5">Copy APP</text>
  <text x="354" y="356" fill="#cfbfdf" font-size="16">Discover · collect · compare</text>
  <g font-size="13" text-anchor="middle" fill="#e0d3f4"><rect x="354" y="379" width="71" height="28" rx="7" fill="#49375f"/><text x="389.5" y="398">Skills</text><rect x="435" y="379" width="71" height="28" rx="7" fill="#49375f"/><text x="470.5" y="398">Cases</text><rect x="516" y="379" width="77" height="28" rx="7" fill="#49375f"/><text x="554.5" y="398">Checks</text></g>
  <circle cx="360" cy="436" r="3.5" fill="#b39aef"/><text x="373" y="441" fill="#bba8d4" font-size="13">Evidence stays local</text>
  <!-- iOS -->
  <g filter="url(#shadow)"><rect x="676" y="178" width="560" height="150" rx="18" fill="url(#ios)" stroke="#417866"/></g>
  <rect x="698" y="204" width="48" height="48" rx="13" fill="#24594a"/>
  <rect x="712" y="212" width="20" height="32" rx="4" stroke="#a0f0cd" stroke-width="1.7"/><path d="M719 217h6m-5 22h4" stroke="#a0f0cd" stroke-width="1.7" stroke-linecap="round"/>
  <text x="764" y="228" fill="#e7fff4" font-size="25" font-weight="700">Jailbroken iPhone</text>
  <text x="764" y="262" fill="#b0d6c7" font-size="16">USB · OpenSSH · iOS MCP / iCTRL</text>
  <text x="698" y="300" fill="#8eb7a7" font-size="14">Package · sandbox · UI · optional runtime</text>
  <!-- macOS -->
  <g filter="url(#shadow)"><rect x="676" y="350" width="560" height="150" rx="18" fill="url(#mac)" stroke="#8a6554"/></g>
  <rect x="698" y="376" width="48" height="48" rx="13" fill="#664739"/>
  <rect x="707" y="385" width="30" height="20" rx="3" stroke="#ffd4ad" stroke-width="1.7"/><path d="M722 406v5m-9 0h18" stroke="#ffd4ad" stroke-width="1.7" stroke-linecap="round"/>
  <text x="764" y="400" fill="#fff0e2" font-size="25" font-weight="700">macOS App</text>
  <rect x="1058" y="380" width="154" height="25" rx="12.5" fill="#58453a"/><text x="1135" y="397" text-anchor="middle" fill="#ffd3a9" font-size="11" font-weight="700" letter-spacing=".6">EXPERIMENTAL</text>
  <text x="764" y="434" fill="#dcc1b1" font-size="16">ChatComputer · dedicated virtual Mac</text>
  <text x="698" y="472" fill="#bfa598" font-size="14">App package · AX · screenshots · bounded input</text>
  <!-- Deliverables -->
  <rect x="44" y="552" width="1192" height="140" rx="18" fill="url(#output)" stroke="#52607a"/>
  <text x="68" y="580" fill="#9daec9" font-size="11" font-weight="700" letter-spacing="1.7">REVIEWED OUTPUT</text>
