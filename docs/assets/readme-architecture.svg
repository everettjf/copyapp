  <path d="M286 340H323" stroke="#81baff" stroke-width="2" marker-start="url(#arrowBlue)" marker-end="url(#arrowBlue)"/>
  <path d="M624 335H645V253H667" stroke="#62dfb5" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrowGreen)" marker-end="url(#arrowGreen)"/>
  <path d="M624 345H645V425H667" stroke="#ffb77b" stroke-width="2" stroke-linejoin="round" marker-start="url(#arrowOrange)" marker-end="url(#arrowOrange)"/>
  <path d="M474 481V540" stroke="#b9a0f9" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <text x="492" y="519" fill="#a999c8" font-size="12">review + build + check</text>
