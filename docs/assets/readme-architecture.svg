<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" fill="none" role="img" aria-labelledby="title description">
<title id="title">Copy APP architecture: understand, rebuild, verify</title>
<desc id="description">Codex or Claude Code uses Copy APP to collect evidence from a jailbroken iPhone or a ChatComputer virtual Mac, build an independent app and compare selected behavior.</desc>
<defs>
  <linearGradient id="background" x1="0" y1="0" x2="1280" y2="760" gradientUnits="userSpaceOnUse"><stop stop-color="#fffaf0"/><stop offset=".5" stop-color="#f8fcf8"/><stop offset="1" stop-color="#edf7ff"/></linearGradient>
  <radialGradient id="blue"><stop stop-color="#8ecbff" stop-opacity=".16"/><stop offset="1" stop-color="#8ecbff" stop-opacity="0"/></radialGradient>
  <radialGradient id="purple"><stop stop-color="#bca3ed" stop-opacity=".14"/><stop offset="1" stop-color="#bca3ed" stop-opacity="0"/></radialGradient>
  <linearGradient id="agent" x1="44" y1="208" x2="279" y2="473" gradientUnits="userSpaceOnUse"><stop stop-color="#edf7ff"/><stop offset="1" stop-color="#e3f0ff"/></linearGradient>
  <linearGradient id="cli" x1="331" y1="208" x2="616" y2="473" gradientUnits="userSpaceOnUse"><stop stop-color="#f4edff"/><stop offset="1" stop-color="#eee4ff"/></linearGradient>
  <linearGradient id="ios" x1="676" y1="178" x2="1236" y2="328" gradientUnits="userSpaceOnUse"><stop stop-color="#e6f8ec"/><stop offset="1" stop-color="#dff4e9"/></linearGradient>
  <linearGradient id="mac" x1="676" y1="350" x2="1236" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#fff2e4"/><stop offset="1" stop-color="#ffead9"/></linearGradient>
  <linearGradient id="output" x1="44" y1="552" x2="1236" y2="692" gradientUnits="userSpaceOnUse"><stop stop-color="#edf7ff"/><stop offset=".5" stop-color="#f2ecff"/><stop offset="1" stop-color="#e7f6e9"/></linearGradient>
  <filter id="shadow" x="-15%" y="-15%" width="130%" height="145%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#6f9180" flood-opacity=".12"/></filter>
  <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#287aa8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#16875c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="m2 1 6 4-6 4" stroke="#c0642d" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="arrowPurple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="m2 1 6 4-6 4" stroke="#7955b4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1280" height="760" rx="24" fill="url(#background)"/>
<rect x=".5" y=".5" width="1279" height="759" rx="23.5" stroke="#b5cdbf" stroke-opacity=".35"/>
<ellipse cx="190" cy="180" rx="420" ry="290" fill="url(#blue)"/><ellipse cx="980" cy="550" rx="430" ry="300" fill="url(#purple)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
