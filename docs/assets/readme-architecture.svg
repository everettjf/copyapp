  <rect x="68" y="604" width="40" height="48" rx="7" fill="#254965"/><path d="M80 619h16m-16 8h16m-16 8h10" stroke="#8fd6ff" stroke-width="2" stroke-linecap="round"/>
  <text x="124" y="626" fill="#eef6ff" font-size="21" font-weight="650">Report + specification</text><text x="124" y="652" fill="#9db3cc" font-size="14">Cited findings + selected scope</text>
  <rect x="455" y="604" width="48" height="48" rx="12" fill="#453660"/><path d="m469 617 10-5 10 5v17l-10 6-10-6zm0 0 10 6 10-6m-10 6v17" stroke="#c6a6ff" stroke-width="1.7" stroke-linejoin="round"/>
  <text x="519" y="626" fill="#f4efff" font-size="21" font-weight="650">Independent app</text><text x="519" y="652" fill="#b6a8cb" font-size="14">Source + runnable IPA / .app</text>
  <rect x="855" y="604" width="48" height="48" rx="12" fill="#345540"/><path d="m868 628 8 8 15-19" stroke="#a5efb3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="919" y="626" fill="#effff1" font-size="21" font-weight="650">Selected-flow checks</text><text x="919" y="652" fill="#a9c4ac" font-size="14">Behavior + screenshots + gaps</text>
  <text x="44" y="733" fill="#91a0b8" font-size="14">Selected behavior. Cited evidence. Clear limits.</text>
  <text x="1236" y="733" text-anchor="end" fill="#8493ab" font-size="12">iOS WORKFLOWS PRESERVED · macOS EXPERIMENTAL</text>
</g>
</svg>
