  <text x="68" y="71" text-anchor="middle" fill="#087d44" font-size="19" font-weight="700">C/A</text>
  <text x="108" y="75" fill="#203c35" font-size="38" font-weight="750" letter-spacing="-1">Copy APP</text>
  <rect x="897" y="48" width="339" height="31" rx="15.5" fill="#ffffff" stroke="#c1d8c8"/>
  <circle cx="917" cy="63.5" r="4" fill="#087d44"/>
  <text x="934" y="69" fill="#345749" font-size="14" font-weight="600" letter-spacing=".8">JAILBROKEN iOS + macOS</text>
  <text x="44" y="132" fill="#476256" font-size="25" font-weight="500">Understand the original. Build independently. Compare the result.</text>
